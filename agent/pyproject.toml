[project]
name = "katagiri-agent"
version = "0.1.0"
description = "LangGraph homework agent that drives katagiri (stdio MCP) and the Obsidian Local REST API MCP server. Separate uv project on purpose: keeps katagiri's dependency tree free of the LangChain stack."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=0.2",
    "langchain-mcp-adapters>=0.1",
    "langchain-openai>=0.2",
    "langgraph-checkpoint-sqlite>=3.0.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/katagiri_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
